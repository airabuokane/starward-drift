      c.fillStyle='rgba(60,80,40,.18)';for(let i=0;i<40;i++){c.beginPath();c.ellipse(g.x+R()*g.w,g.y+(R()<0.5?R()*40:g.h-R()*40),10+R()*30,6+R()*14,R()*3,0,TAU);c.fill();}}

function hexA(hex,a){const n=parseInt(hex.slice(1),16);return'rgba('+(n>>16)+','+(n>>8&255)+','+(n&255)+','+a+')';}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}

// 光の向き（建物の3D照明と同じ向き）。kx,kz＝高さ1あたりの影の伸び
function sunVec(C){let v,a;if(C.burning){v=[900,300,200];a=0.38;}else if(C.day&&C.dusk){v=[900,200,260];a=0.46;}else if(C.day){v=[500,300,900];a=0.56;}else{v=[300,200,800];a=0.3;}
  let kx=v[0]/v[2],kz=v[1]/v[2];const L=Math.hypot(kx,kz);if(L>1.7){kx*=1.7/L;kz*=1.7/L;}return{kx,kz,a};}

  if(!h.alive||h.jump)return false;
  const hLv=lvOf(h);if(tLv!==undefined&&tLv!==hLv&&!tElev)return false;
  const d=Math.hypot(x-h.x,y-h.y);

}

    if(e.data.stuck>8){const sdir=e.data.lastSide||(Math.random()<0.5?1:-1);e.data.side=sdir*(e.data.stuckT>1.5?2.2:1.4);e.data.sideT=e.data.stuckT>1.5?1.2:0.7;e.data.lastSide=e.data.stuckT>2.5?-sdir:sdir;e.data.stuck=0;}

const CLOSE_ATK={claw:1,combo:1,grab:1,spin:1,slam:1};

  const ok=[];
  for(const a of list){
    if(((e.data.acd||{})[a.k]||0)>G.t)continue;
    if(a.t==='acid'&&!(e.items&&e.items.bottle.alive))continue;

    const maxD=close?e.r+t.r+(a.max||10)+(e.def.minion?0:30):a.max||300,minD=a.min||0;
    if(d<minD||d>maxD)continue;
    if(close&&(!sameLevel(e,t)||t.jump))continue;
    if(!close&&a.t!=='decoy'&&a.t!=='teleport'&&a.t!=='roar'&&a.t!=='scream'&&!los(e,t))continue;
    ok.push(a);
  }
  if(!ok.length)return null;
  let s=0;for(const a of ok)s+=a.w||1;let r=Math.random()*s;
  for(const a of ok){r-=a.w||1;if(r<=0)return a;}
  return ok[0];
}

  else if(a.t==='proj'){warnCue(e);atkSfx(e,'proj');e.data.charge=(a.wind||0.5)*WIND_MUL+WIND_ADD;e.data.chT=t;e.data.chProj=a.proj||null;}

const CIV_SCREAM=['うわあああ！','なんだあれ！？','逃げろ！','ば、化け物…！','きゃあああ！','助けて！'],CIV_THANK=['あ、ありがとう…！','助かった…','ありがとうございます！','な、何者なんだ…'];
function spawnCivs(theme){
  G.civs=[];G.civKill=0;const cfg=CIV_CFG[theme];if(!cfg)return;
  for(let i=0;i<cfg.n;i++){let q=null;for(let k=0;k<60;k++){const x=rand(AREA.x+40,AREA.x+AREA.w-40),y=rand(AREA.y+40,AREA.y+AREA.h-40);if(!insideSolid(x,y,10)&&!hollowAt(x,y)&&!(G.rivZ&&G.rivZ.some(w=>x>w.x&&x<w.x+w.w&&y>w.y&&y<w.y+w.h))){q={x,y};break;}}if(!q)continue;
    const female=Math.random()<0.45;
    G.civs.push({kind:'human',civ:true,see:cfg.see,x:q.x,y:q.y,px:q.x,py:q.y,r:8,alive:true,hp:24,hpMax:24,ang:rand(-3,3),roof:null,present:true,suit:0,isPlayer:false,
      cloth:hexN(pickR(Math.random,CIV_CLOTH)),hair:pickR(Math.random,CIV_HAIR),longHair:female&&Math.random()<0.7,walk:0,moving:false,weapon:'none',punchT:0,guard:false,stun:0,roll:null,flash:0,
      spd:rand(28,40),wp:null,wpT:0,fear:null,fearT:0,sayB:null,name:'一般人',ref:{age:rand(16,60)},data:{},kn:null});}
}
function civSay(c,s){c.sayB={s,t:0};}
function civTick(dt){
  if(!G.civs||!G.civs.length)return;const p=G.player;
  for(const c of G.civs){if(!c.alive)continue;c.px=c.x;c.py=c.y;if(c.sayB){c.sayB.t+=dt;if(c.sayB.t>2.4)c.sayB=null;}
    if(c.stun>0){c.stun-=dt;continue;}
    if(c.gather){const g=c.gather,d=Math.hypot(g.x-c.x,g.y-c.y);c.moving=false;if(d>c.gR){const s2=Math.min(d-c.gR,c.spd*1.5*dt),ox=c.x,oy=c.y;c.x+=(g.x-c.x)/d*s2;c.y+=(g.y-c.y)/d*s2;collide(c);c.ang=Math.atan2(c.y-oy,c.x-ox);c.moving=true;c.walk+=Math.hypot(c.x-ox,c.y-oy)*0.16;}else c.ang=angTo(c,g);
      c.thxT-=dt;if(c.thxT<=0&&d<c.gR+120){c.thxT=rand(2.5,6);civSay(c,pickR(Math.random,c.thx));}continue;}
    if(c.yard&&G.cataE&&G.cataE.length){// 校庭：星人が来たら、校庭の中をでたらめな方向へ走り回る
      const Y=c.yard;c.rnT=(c.rnT||0)-dt;if(!c.rn||c.rnT<=0||Math.hypot(c.rn.x-c.x,c.rn.y-c.y)<12){c.rn={x:rand(Y.x,Y.x+Y.w),y:rand(Y.y,Y.y+Y.h)};c.rnT=rand(0.8,2.4);if(Math.random()<0.25)civSay(c,pickR(Math.random,['うわああ！','きゃああ！','なんだよあれ！','助けて！']));}
      const dx=c.rn.x-c.x,dy=c.rn.y-c.y,d=Math.hypot(dx,dy)||1,sp=c.spd*2.6*dt,ox=c.x,oy=c.y;c.x+=dx/d*sp;c.y+=dy/d*sp;collide(c);c.x=clamp(c.x,Y.x,Y.x+Y.w);c.y=clamp(c.y,Y.y,Y.y+Y.h);c.ang=Math.atan2(c.y-oy,c.x-ox);c.moving=true;c.walk+=Math.hypot(c.x-ox,c.y-oy)*0.16;continue;}
    let mvx=null,mvy=null,spd=c.spd;
    if(c.see){let th=null,td=270;for(const e of G.enemies){if(!e.alive||(e.def.dormant&&!e.data.awake))continue;const d=dist(c,e);if(d<td&&los(c,e)){td=d;th=e;}}
      if(th){if(!c.fear||c.fearT<=0){if(Math.random()<0.5)civSay(c,pickR(Math.random,CIV_SCREAM));if(Math.random()<0.3)sfx('scream',0.25*(1-Math.min(1,dist(c,p)/500)));}c.fear=th;c.fearT=4;}}
    if(c.hurtFrom){c.fear=c.hurtFrom;c.fearT=3;c.hurtFrom=null;}
    if(c.fear&&c.fearT>0){c.fearT-=dt;const a=angTo(c.fear,c)+Math.sin(G.t*2+c.x)*0.4;mvx=c.x+Math.cos(a)*60;mvy=c.y+Math.sin(a)*60;spd=c.spd*3.2;}
    else{c.fear=null;if(!c.wp||G.t>c.wpT||Math.hypot(c.wp.x-c.x,c.wp.y-c.y)<10){c.wp={x:clamp(c.x+rand(-220,220),AREA.x+30,AREA.x+AREA.w-30),y:clamp(c.y+rand(-220,220),AREA.y+30,AREA.y+AREA.h-30)};c.wpT=G.t+rand(4,9);if(Math.random()<0.25){c.wp=null;c.wpT=G.t+rand(1,3);}}
      if(c.wp){mvx=c.wp.x;mvy=c.wp.y;}}
    c.moving=false;
    if(mvx!=null){const d=Math.hypot(mvx-c.x,mvy-c.y);if(d>2){const s2=Math.min(d,spd*(c.inRiver?0.5:1)*dt);const ox=c.x,oy=c.y;c.x+=(mvx-c.x)/d*s2;c.y+=(mvy-c.y)/d*s2;collide(c);
      if(Math.hypot(c.x-ox,c.y-oy)<s2*0.3){c.wp=null;c.wpT=0;}c.ang=Math.atan2(c.y-oy,c.x-ox);c.moving=true;c.walk+=Math.hypot(c.x-ox,c.y-oy)*0.16;}}
    c.x=clamp(c.x,AREA.x+10,AREA.x+AREA.w-10);c.y=clamp(c.y,AREA.y+10,AREA.y+AREA.h-10);
    if(c.yard){const Y=c.yard;// 校庭の外へは出ない
      if(c.x<Y.x||c.x>Y.x+Y.w||c.y<Y.y||c.y>Y.y+Y.h){c.x=clamp(c.x,Y.x,Y.x+Y.w);c.y=clamp(c.y,Y.y,Y.y+Y.h);c.wp=null;c.wpT=0;}
      if(c.wp){c.wp.x=clamp(c.wp.x,Y.x,Y.x+Y.w);c.wp.y=clamp(c.wp.y,Y.y,Y.y+Y.h);}}
  }
}
function damageCiv(c,amt,src){
  if(!c.alive)return;c.hp-=amt;c.hurtFrom=src||null;c.stun=0.25;
  for(let i=0;i<12;i++)fx({k:'blood',x:c.x,y:c.y,vx:rand(-150,150),vy:rand(-150,150),color:'#b3001b',d:rand(0.4,0.9),s:rand(2,5)});
  if(c.see||src&&src.kind==='human')civSay(c,pickR(Math.random,['うっ…！','痛っ！','な、何…！？']));
  if(c.hp<=0)killCiv(c,src);return 'hit';
}
function killCiv(c,src){
  c.alive=false;G.civDead=(G.civDead||0)+1;c.sayB=null;if(src&&src.kind==='enemy'&&src.def&&src.def.tora)toraAbsorb(src,c);for(let i=0;i<42;i++)fx({k:'blood',x:c.x,y:c.y,vx:rand(-240,240),vy:rand(-240,240),color:i%3?'#8a0010':'#b3001b',d:rand(0.6,1.2),s:rand(2,6.5)});
  G.stains.push({x:c.x,y:c.y,r:16,c:'rgba(120,0,10,.6)'});
  for(const o of G.civs)if(o.alive&&o.see&&dist(o,c)<260&&los(o,c)){o.fear=src&&src.kind==='human'?src:(src||c);o.fearT=4;if(Math.random()<0.4)civSay(o,pickR(Math.random,CIV_SCREAM));}
  if(src&&src.isPlayer&&!G.m.cata){G.civKill=(G.civKill||0)+1;
    if(G.civKill===3){msg('【黒い球】いっぱんじんを ころしすぎ　つぎは しっかく','#ff4d4d');G.civWarn=4;sfx('warn',1);}
    else if(G.civKill>=5&&src.alive){msg('【黒い球】しっかく','#ff4d4d');G.civWarn=4;sfx('warn',1);(G.later=G.later||[]).push({t:G.t+1,fn:()=>{if(src.alive){fx({k:'flash',x:src.x,y:src.y,y3:30,r:20,d:0.3});killHuman(src);}}});}
    else if(G.civKill<3)msg('一般人を殺してしまった（'+G.civKill+'）','#ff9f43');}
}
function civThank(e,src){if(!G.civs||!src||src.kind!=='human')return;let n=0;for(const c of G.civs){if(!c.alive||!c.see||dist(c,e)>320||dist(c,src)>360)continue;if(Math.random()<0.6){setTimeout(()=>{if(c.alive)civSay(c,pickR(Math.random,CIV_THANK));},300+Math.random()*900);if(++n>=3)break;}}}
// フレンドリーファイヤ：プレイヤーのXガン（ロック中は味方に当たらない）
function humanHB(h){const s=(h.civ?1:(h.ref&&h.ref.age<12?0.72:h.ref&&h.ref.age<16?0.86:1)),hh=46*CH*s*1.05,y0=elevOf(h);return{x:h.x,z:h.y,y0,y1:y0+hh,rad:5.5,head:y0+hh*0.82};}
function ffTargets(h){return G.humans.filter(o=>o!==h&&o.alive&&o.present&&!o.gone).concat((G.civs||[]).filter(c=>c.alive));}
function ffRay(h,r,xs){if(h.lockT)return null;let best=null;const lim=r.t;for(const o of ffTargets(h)){const hb=humanHB(o);if(xs){hb.rad+=3.5;}const hit=rayCyl(r.O,r.D,hb,lim);if(hit&&(!best||hit.t<best.t))best={o,t:hit.t};}return best;}
function ffApply(o,dmg,src,lag){const go=()=>{if(!o.alive)return;fx({k:'shock',x:o.x,y:o.y,r:14,color:'255,120,120',w:3,d:0.3});sfx('hit',0.6);if(o.civ)damageCiv(o,lag?999:dmg*1.6,src);else damageHuman(o,dmg,src,{kind:'friendly',inner:!!lag});};
  if(lag)(G.later=G.later||[]).push({t:G.t+lag,fn:go});else go();}
function ffMelee(h,reach,arc,dmg){if(h.isPlayer&&h.lockT)return;for(const o of ffTargets(h)){if(diffFloor(h,o)||!sameLevel(h,o)&&!h.jump)continue;const dd=dist(h,o)-o.r;if(dd>reach)continue;if(Math.abs(angDiff(h.ang,angTo(h,o)))>arc)continue;if(lvRay(lvOf(h),h.x,h.y,o.x,o.y)<0.99)continue;ffApply(o,dmg,h,0);if(h.isPlayer&&!o.civ)ftext(o.x,o.y-24,'味方に当たった','#ff9f43');}}

// 高台（建物の屋上）にいる相手：遠距離・浮遊は下から攻撃できる。ジャンプ系は届く高さなら飛び乗る。それ以外（近接・中距離）は狙わない
function onHigh(h){return !!(h.roof&&!h.roof.isFloor);}
function leapReach(e,h){return has(e,'leap')&&!e.def.dormant&&(elevOf(h)-elevOf(e))<=(e.def.leapH||150);}
function reachable(e,h){return e.flying||has(e,'leap')||has(e,'ranged')||has(e,'blindStrike')||sameLevel(e,h);}
function strMulF(s){const a=Math.max(1,Math.floor(s)),b=Math.min(6,a+1),f=s-a,A=STR_MUL[a],B=STR_MUL[b];return{hp:A.hp+(B.hp-A.hp)*f,dmg:A.dmg+(B.dmg-A.dmg)*f};}
function toraAttacks(s){const L=ALIENS.tora.attacks.slice(),q=s>=6?0.7:1;
  if(s>=3)L.push({k:'tw',t:'wave',anim:'spin',min:20,max:190,cd:5*q,wind:0.6,R:185,arc:1.1,w:2});
  if(s>=4)L.push({k:'tsp',t:'wave',anim:'claw',min:60,max:330,cd:6*q,wind:0.9,R:330,arc:0.12,w:1.6,mul:1.3});
  if(s>=5)L.push({k:'tsk',t:'spike',min:60,max:380,cd:7*q,wind:1.0,R:42,w:1.4});return L;}
function toraAbsorb(t,v){if(!t||!t.alive||!t.def.tora)return;const s0=t.data.str||ALIENS.tora.str,s1=Math.min(6,s0+0.5);t.data.str=s1;t.data.mut=Math.min(8,(t.data.mut||0)+1);
  const m=strMulF(s1),ratio=t.hp/t.hpMax,big=s1>=4;t.def=Object.assign({},t.def,{str:Math.floor(s1),size:big?4:3,hMul:1+(s1-2)*0.07,attacks:toraAttacks(s1)});
  t.hpMax=ALIENS.tora.hp*m.hp;t.hp=Math.min(t.hpMax,ratio*t.hpMax+t.hpMax*0.05);t.dmg=ALIENS.tora.dmg*m.dmg*DMG_MUL;t.r=SIZE_R[t.def.size];
  v.absorbed=true;if(v.kind==='enemy')v.corpse=false;
  for(let i=0;i<16;i++){const a=i/16*TAU;fx({k:'blood',x:v.x+Math.cos(a)*10,y:v.y+Math.sin(a)*10,vx:(t.x-v.x)*1.5,vy:(t.y-v.y)*1.5,color:'#7a0f12',d:0.5,s:3});}
  fx({k:'shock',x:t.x,y:t.y,r:t.r*3,color:'255,90,70',w:6,d:0.5});sfx('growl',0.8);if(dist(t,G.player)<520)ftext(t.x,t.y-t.r-24,'喰らった……','#ff7b72');}
function toraPerceive(e){const sight=(e.def.sight||520)*0.8,weak=(e.data.str||e.def.str)<3;let best=null,bd=1e9;e.data.avoid=null;
  for(const h of G.humans){if(!h.alive||!h.present)continue;const d=dist(e,h);if(stealthWorks(e,h)&&d>30)continue;if(d<sight&&los(e,h)&&d<bd){bd=d;best=h;}}
  if(best&&weak){if(bd<220)e.data.avoid=best;best=null;}// 弱いうちはメンバーを避ける
  if(best){e.target=best;e.lastSeenT=G.t;return;}
  if(!weak&&e.target&&e.target.kind==='human'&&!e.target.civ&&e.target.alive&&G.t-e.lastSeenT<4)return;
  let b2=null,d2=1e9;for(const c of G.civs||[]){if(!c.alive)continue;const d=dist(e,c);if(d<sight*3&&d<d2){d2=d;b2=c;}}
  for(const o of G.enemies){if(o===e||!o.alive||!/M$/.test(o.type))continue;const d=dist(e,o)*0.8;if(d<sight*3&&d<d2){d2=d;b2=o;}}
  e.target=b2;if(b2)e.lastSeenT=G.t;}
function perceive(e){
  if(e.data.aggroT>G.t&&e.target&&e.target.alive&&e.target.present!==false){e.lastSeenT=G.t;return;}
  if(e.def.tora){toraPerceive(e);return;}
  if(has(e,'blindStrike'))return;
  const sight=(e.def.sight||380)*0.72*(G.m.cata?1.8:1);let best=null,bd=1e9;// カタストロフィーは遠くまで見つける
  for(const h of HUM()){
    if(!h.alive)continue;let d=dist(e,h);if(h.civ){if(e.def.noCiv)continue;d*=G.m.cata?4:e.def.gantzFirst?5:h.see?1.15:0.85;}// カタストロフィーではメンバー優先
    if(!h.civ&&stealthWorks(e,h)&&d>30)continue;
    if(h.isPlayer&&G.cataBag&&!G.cataBag.used)continue; // カタストロフィー：装備するまでは狙われない
    if(d<sight&&los(e,h)){if(!reachable(e,h))d*=3;if(d<bd){best=h;bd=d;}}
  }
  if(best){e.target=best;e.lastSeenT=G.t;return;}
  const hm=has(e,'hearing')?1.8:1;
  for(const n of G.noises){
    if(G.t-n.t>0.25||!n.src.alive||n.src.kind!=='human'||(n.src.isPlayer&&G.cataBag&&!G.cataBag.used))continue;
    if(Math.hypot(n.x-e.x,n.y-e.y)<n.r*hm){
      if(e.target!==n.src&&hm>1&&e.revealed&&Math.hypot(n.x-e.x,n.y-e.y)>n.r)reveal(e,'hearing');
      e.target=n.src;e.lastSeenT=G.t;return;
    }
  }
  if(e.target&&e.target.isPlayer&&G.cataBag&&!G.cataBag.used)e.target=null;
  if(e.target&&(!e.target.alive||G.t-e.lastSeenT>(stealthWorks(e,e.target)?1:6)))e.target=null;
}

function visBox(g){const B=new THREE.Box3(),b=new THREE.Box3();const walk=(o)=>{if(!o.visible)return;if(o.isMesh&&o.geometry&&!(o.material&&o.material.transparent&&o.material.opacity<0.3)){if(!o.geometry.boundingBox)o.geometry.computeBoundingBox();b.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld);B.union(b);}for(const c of o.children)walk(c);};walk(g);return B;}

function init3D(){

function resize3D(){

  R3.renderer.setSize(W,H,false);glC.style.width=W+'px';glC.style.height=H+'px';
  const asp=W/H,hf=2*(0.68+0.8*0.16);

    x.strokeStyle='#5a3b26';x.lineWidth=2;for(let i=0;i<4;i++){for(let k=0;k<6;k++){x.beginPath();x.moveTo(i*64+18,40+k*28);x.lineTo(i*64+58,40+k*28);x.stroke();}}

      if(R()<0.5){x.fillStyle='rgba(0,0,0,.14)';x.fillRect(gx+ww+6,gy-2,ww*0.42,wh+6);}}

      const ry=oy+ch*0.56;x.fillStyle=kind==='danchi'?'#f2efe8':'rgba(110,128,142,.85)';x.fillRect(ox,ry,cw,ch*0.38);x.fillStyle='#55585c';x.fillRect(ox,ry-3,cw,4);x.fillStyle='rgba(0,0,0,.28)';x.fillRect(ox,oy+ch*0.94,cw,ch*0.06);x.fillStyle='#e6e3dc';x.fillRect(ox,oy,3,ch*0.94);

function boxUV(w,h,d,tw,th){

  for(let f=0;f<6;f++){let su,sv;if(f<2){su=d/tw;sv=h/th;}else if(f<4){su=w/tw;sv=d/tw;}else{su=w/tw;sv=h/th;}
    for(let i=0;i<4;i++){const k=f*4+i;uv.setXY(k,uv.getX(k)*su,uv.getY(k)*sv);}}
  uv.needsUpdate=true;return g;
}

function gableGeo(w,d,rh,alongX){

function rFace(b,side){

    rm.push(o);});

}

  if(d.wind>0)return{k:d.windKind==='grab'?'grab':d.combo?'combo':'claw',ph:'wind',p:1-d.wind/(d.windMax||0.4),side:d.combo&&d.combo.n%2?-1:1};

    M.arms.forEach((a,i)=>{if(raise){a.rotation.set((i?0.3:-0.3),0,raise+(lk>0?-0.6:0));}else a.rotation.set(0,0,(i?1:-1)*ph*0.45);});
  }
  M.wings.forEach(w=>{w.p.rotation.x=w.sd*Math.sin(G.t*20+e.t*3)*0.7;});

function allTraitsOf(type){

  if(d.forms){s.add('forms');for(const f of d.forms)f.traits.forEach(t=>s.add(t));}

  if(d.dormant)s.add('dormant');if(d.items)s.add('clock');
  for(const a of (d.attacks||[]).concat(...(d.forms||[]).map(f=>f.attacks||[])))if(CLUES[a.t])s.add(a.t);
  return [...s].filter(t=>CLUES[t]);

function physOf(age){return age<12?0.62:age<16?0.8:age<20?0.95:age<=32?1.06:age<=45?0.96:age<=60?0.82:0.66;}
function rollAge(){const r=Math.random();return r<0.08?9+Math.floor(Math.random()*6):r<0.18?15+Math.floor(Math.random()*3):r<0.68?18+Math.floor(Math.random()*18):r<0.9?36+Math.floor(Math.random()*20):56+Math.floor(Math.random()*23);}
function applyAge(r){const ph=physOf(r.age)*(0.9+Math.random()*0.2);r.phys=ph;r.str*=ph;r.reflex=clamp(r.reflex*(r.age<16?1:ph),0.3,1.15);r.hpMax=Math.round(r.hpMax*(0.82+0.18*ph));
  if(r.age>=56)r.hair='#9a9a96';return r;}
